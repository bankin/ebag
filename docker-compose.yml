services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: some
      POSTGRES_DB: ebag
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d ebag" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://root:some@db:5432/ebag
      ALEMBIC_DATABASE_URL: postgresql://root:some@db:5432/ebag
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
