[tool.fastapi]
entrypoint = "app.main:app"

[project]
name = "ebag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
